plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nilaalavai.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nilaalavai.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Keeps every kotlin-stdlib artifact on one version (avoids duplicate-class errors).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
