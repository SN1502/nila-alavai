name: Build apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK.
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: python3 .github/report_error.py build.log

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/nila-alavai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  windows:
    name: Windows app (7, 8, 10, 11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Electron and electron-builder
        working-directory: desktop
        shell: bash
        run: npm install --no-audit --no-fund

      # Unsigned build: Windows SmartScreen will ask "Run anyway" on first launch.
      - name: Build installer and portable exe
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee ../build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: python .github/report_error.py build.log

      - name: Collect exe files
        shell: bash
        run: |
          mkdir -p out
          cp desktop/release/*.exe out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  release:
    name: Publish release
    needs: [apk, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      # A release gives direct download links for phones and PCs.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nila Alavai v1.0.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            **Android:** tap `nila-alavai.apk` on your phone and install.

            **Windows 7, 8, 10 or 11:**
            - `Nila-Alavai-Setup-1.0.0.exe` installs the app with Start menu and desktop shortcuts (picks 32-bit or 64-bit automatically).
            - `Nila-Alavai-Portable-1.0.0.exe` runs without installing, from any folder or USB drive.

            The Windows files are not code-signed, so SmartScreen may show "Windows protected your PC". Click **More info → Run anyway**.
