name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK.
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nila-alavai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nila-alavai-apk
          path: nila-alavai.apk

      # A release gives a direct download link that opens on a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nila Alavai v1.0.${{ github.run_number }}
          body: Tap nila-alavai.apk below to download and install on Android.
          files: nila-alavai.apk
          make_latest: true
